[workspace]
resolver = "2"
members = [
    "crates/ginir-theme-core",
    "crates/ginir-theme-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-only"
repository = "https://github.com/Gergish001/Ginir-rs"
authors = ["iNiR Rust contributors"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
debug = "line-tables-only"

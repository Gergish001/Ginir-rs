[package]
name = "ginir-shell"
description = "Rust-native Ginir shell (iNiR look, Wayland layer-shell)"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/Gergish001/Ginir-rs"
authors = ["iNiR Rust contributors"]
rust-version = "1.93"

[[bin]]
name = "ginir-shell-rs"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
gtk4 = "0.11"
gtk4-layer-shell = "0.9"
serde_json = "1"

[workspace]
